name: Update market data

on:
  schedule:
    - cron: "30 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-data.mjs
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update bundled market data
          file_pattern: data/market-data.json
